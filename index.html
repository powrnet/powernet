<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POWRNET - Create, Work, Learn AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#000;color:#fff;padding:0 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 4px}
.logo{font-size:22px;font-weight:900}.logo span{color:#a855f7}
.join{background:#fff;color:#000;border:0;padding:8px 20px;border-radius:999px;font-weight:700}
h1{font-size:34px;line-height:1.05;text-align:center;margin:12px 0 6px;font-weight:900}
h1 span{color:#a855f7}
.sub{text-align:center;color:#999;margin-bottom:16px;font-size:14px}
.tabs{display:flex;background:#111;border:1px solid #222;border-radius:999px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:transparent;color:#aaa;padding:14px 4px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer}
.tabs button.active{background:#a855f7;color:#fff}
.page{display:none}.page.active{display:block}
.search{width:100%;background:#1a1a1a;border:1px solid #333;color:#fff;padding:14px 16px;border-radius:14px;font-size:15px;outline:none;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chips button{background:#1a1a1a;border:1px solid #333;color:#fff;padding:7px 12px;border-radius:999px;font-size:12px;cursor:pointer}
.chips button.active{background:#a855f7}
.card{background:#111;border:1px solid #222;border-radius:20px;padding:16px;margin-bottom:12px}
.card b{font-size:15px}.card p{color:#aaa;font-size:13px;margin:6px 0;line-height:1.5}
.meta{font-size:11px;color:#888}
.btn{width:100%;background:#a855f7;border:0;color:#fff;padding:13px;border-radius:999px;font-weight:800;margin-top:10px;cursor:pointer}
.btn2{width:100%;background:#fff;color:#000;border:0;padding:13px;border-radius:999px;font-weight:800;margin-top:10px;cursor:pointer}
textarea{width:100%;background:#1a1a1a;border:1px solid #333;color:#fff;padding:14px;border-radius:14px;min-height:70px;margin:8px 0}
.videoBox{background:#000;border:1px solid #333;border-radius:16px;height:160px;display:flex;align-items:center;justify-content:center;color:#888;text-align:center;padding:14px;margin-top:10px}
.badge{display:inline-block;background:#1a1a1a;border:1px solid #333;padding:4px 8px;border-radius:999px;font-size:11px;margin-right:4px}
.footer{text-align:center;color:#555;font-size:12px;margin-top:24px}
.progress{display:none;margin-top:10px;background:#1a1a1a;border-radius:999px;overflow:hidden}.bar{height:8px;background:#a855f7;width:0%}
</style>
</head>
<body>
<div class="top"><div class="logo">POWR<span>NET</span>.COM</div><button class="join">Join Free</button></div>
<h1>POWER YOUR<br><span>NETWORK.</span></h1>
<p class="sub">Create • Find Jobs • Learn AI — All in One 🇰🇪</p>
<div class="tabs">
<button id="tab-create" class="active" onclick="showTab('create')">✨ Create Video</button>
<button id="tab-jobs" onclick="showTab('jobs')">💼 Jobs</button>
<button id="tab-learn" onclick="showTab('learn')">🧠 Learn AI</button>
</div>
<div id="create" class="page active">
<textarea id="prompt">Funny Kenyan matatu driver dancing in Nairobi traffic, sunset</textarea>
<div class="chips"><button onclick="setPrompt('Funny mama mboga comedy skit, Gikomba market')">😂 Comedy</button><button onclick="setPrompt('Gengetone music video in Kayole, neon lights')">🎵 Music</button><button onclick="setPrompt('Amapiano dance in Kibera at golden hour')">💃 Dance</button><button onclick="setPrompt('Epic football goal in Kasarani, crowd wild')">⚽ Football</button></div>
<button class="btn" onclick="gen()">✨ GENERATE 30s VIDEO</button>
<div class="progress" id="prog"><div class="bar" id="bar"></div></div>
<div class="videoBox" id="vbox"><div><div style="font-size:32px">🎬</div><p>Your 30s video appears here</p></div></div>
<div class="card" style="margin-top:14px"><b>🔥 Trending Prompt:</b><p>"Matatu conductor singing in traffic" — 120K views</p><button class="btn2" onclick="setPrompt('Matatu conductor singing in traffic, funny, Nairobi')">Use This Prompt →</button></div>
</div>
<div id="jobs" class="page">
<input class="search" id="jobSearch" placeholder="🔍 Search ANY job: driver, designer, AI, nurse..." oninput="filterJobs()">
<div class="chips" id="jobChips"><button class="active" onclick="filterJobCat(this,'all')">All</button><button onclick="filterJobCat(this,'AI')">🤖 AI Jobs</button><button onclick="filterJobCat(this,'Remote')">🌍 Remote</button><button onclick="filterJobCat(this,'Nairobi')">📍 Nairobi</button><button onclick="filterJobCat(this,'Creative')">🎨 Creative</button></div>
<div id="jobList"></div>
<div class="card"><b>💡 Can't find it? Tell us</b><p>We search 20+ job sites for you.</p><button class="btn" onclick="alert('Job Alert ON!')">🔔 Create Job Alert</button
