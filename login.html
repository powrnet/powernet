<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - POWRNET</title>
<style>
body{background:#f2f2f2;font-family:system-ui;padding:16px;margin:0}
.card{background:#fff;max-width:400px;margin:40px auto;padding:24px;border-radius:16px}
h1{text-align:center;color:#15803d;margin:0;font-size:32px}
p{text-align:center;color:#666}
label{font-weight:bold;display:block;margin-top:16px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:6px;box-sizing:border-box}
button{width:100%;background:#15803d;color:#fff;border:0;padding:14px;border-radius:10px;font-weight:bold;margin-top:20px;font-size:16px}
a{color:#15803d;text-decoration:none}
.links{text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="card">
<h1>POWRNET</h1>
<p>Welcome back! Login to your account</p>
<label>Email or Phone</label>
<input id="email" placeholder="Enter email or phone">
<label>Password</label>
<input id="pass" type="password" placeholder="Enter password">
<button onclick="doLogin()">Login</button>
<div class="links">
<p>Don't have an account? <a href="signup.html">Sign Up</a></p>
<p><a href="privacy-policy.html">Privacy Policy</a> • <a href="about-us.html">About Us</a></p>
<p><a href="index.html">← Back to Home</a></p>
</div>
</div>
<script>
function doLogin(){
  var e=document.getElementById('email').value;
  var p=document.getElementById('pass').value;
  if(!e || !p){ alert('Please enter email and password'); return; }
  // DIRECT TO DASHBOARD - NO WAITING
  window.location.href='dashboard.html';
}
</script>
</body>
</html>
