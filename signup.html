<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Up - POWRNET</title>
<style>
body{background:#0a0a12;font-family:system-ui;padding:16px;margin:0;color:#fff}
.card{background:#15151f;max-width:400px;margin:30px auto;padding:26px;border-radius:22px;border:1px solid #2a2a3a}
h1{text-align:center;color:#fff;margin:0;font-size:32px} h1 span{color:#a855f7}
p{text-align:center;color:#aaa;margin:8px 0 0}
label{font-weight:bold;display:block;margin-top:16px;font-size:14px}
input{width:100%;padding:13px;background:#222;border:1px solid #444;border-radius:13px;margin-top:6px;box-sizing:border-box;color:#fff}
button{width:100%;background:linear-gradient(90deg,#7c3aed,#db2777);color:#fff;border:0;padding:15px;border-radius:30px;font-weight:800;margin-top:22px;font-size:16px;cursor:pointer}
a{color:#a855f7;text-decoration:none;font-weight:700}
.links{text-align:center;margin-top:18px;color:#aaa;font-size:14px}
</style>
</head>
<body>
<div class="card">
<h1>POWR<span>NET</span></h1>
<p>Create your free account</p>
<label>Full Name</label>
<input id="name" placeholder="e.g. Kevin Kamau">
<label>Email or Phone</label>
<input id="email" placeholder="Enter email or phone">
<label>Password</label>
<input id="pass" type="password" placeholder="Create password">
<button onclick="doSignup()">Create Free Account →</button>
<div class="links">
<p>Already have an account? <a href="login.html">Login</a></p>
<p><a href="privacy-policy.html">Privacy Policy</a> • <a href="about-us.html">About Us</a></p>
<p><a href="index.html">← Back to Home</a></p>
</div>
</div>
<script>
function doSignup(){
  var n=document.getElementById('name').value;
  var e=document.getElementById('email').value;
  var p=document.getElementById('pass').value;
  if(!n || !e || !p){ alert('Please fill all fields'); return; }
  // DIRECT TO DASHBOARD - NO WAITING, NO LOGIN AGAIN
  window.location.href='dashboard.html';
}
</script>
</body>
</html>
